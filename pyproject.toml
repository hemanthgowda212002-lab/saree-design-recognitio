[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colorid"
version = "0.1.0"
description = "Colour-invariant saree design recognition (metric learning, PyTorch)"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "torchvision", "timm>=0.9", "numpy", "pandas", "pillow"]

[tool.setuptools]
packages = ["colorid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
